<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Resume Downloads</title>
  <style>
    * { box-sizing: border-box}
    body {margin: 0;min-height: 100vh;font-family: Arial, sans-serif;background: #0f0f12;color: #fff;padding: 40px 20px}
    .container {max-width: 700px;margin: auto}
    h1 {margin-bottom: 5px}
    .total {font-size: 42px;font-weight: bold;margin: 20px 0 30px}
    .date-group {margin-top: 30px}
    .date {font-size: 18px;font-weight: bold;margin-bottom: 10px}
    .download {padding: 10px 14px;margin: 5px 0;background: #18181c;border-radius: 8px;color: #bbb}
    .empty {color: #777;margin-top: 30px}
    .refresh {margin-top: 20px;padding: 10px 16px;border: none;border-radius: 8px;cursor: pointer}
  </style>
</head>

<body>
  <div class="container">
    <h1>Resume Downloads</h1>
    <div class="total">Total: <span id="total">0</span></div>
    <div id="downloads"></div>
    <button class="refresh" onclick="loadDownloads()">Refresh</button>
  </div>
  <script>
    const SUPABASE_URL = "https://notftzgptyduvsqxzsgq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FTeLTKGF0Q3M8XDEuyoB1w_qONkrXRH";
    let allDownloads = [];
    async function loadDownloads() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/resume_downloads?select=id,downloaded_at&order=downloaded_at.desc`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
        if (!response.ok) throw new Error("Failed to load downloads");
        allDownloads = await response.json();
        document.getElementById("total").textContent = allDownloads.length;
        displayDownloads(allDownloads);
      } catch (error) {
        console.error(error);
        document.getElementById("downloads").innerHTML = `<div class="empty">Unable to load downloads.</div>`;
      }
    }
    function displayDownloads(downloads) {
      const container = document.getElementById("downloads");
      container.innerHTML = "";
      if (downloads.length === 0) {
        container.innerHTML = `<div class="empty">No downloads found.</div>`;
        return;
      }
      const groups = {};
      downloads.forEach(item => {
        const date = new Date(item.downloaded_at);
        const dateString = date.toLocaleDateString("en-IN", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Asia/Kolkata" });
        const timeString = date.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true, timeZone: "Asia/Kolkata" });
        if (!groups[dateString]) groups[dateString] = [];
        groups[dateString].push(timeString);
      });
      Object.keys(groups).forEach(date => {
        const group = document.createElement("div");
        group.className = "date-group";
        group.innerHTML = `<div class="date">${date}</div>`;
        groups[date].forEach(time => {
          const item = document.createElement("div");
          item.className = "download";
          item.textContent = `Downloaded at ${time}`;
          group.appendChild(item);
        });
        container.appendChild(group);
      });
    }
    loadDownloads();
  </script>
</body>

</html>
